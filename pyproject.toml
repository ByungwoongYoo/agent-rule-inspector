[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rule-inspector"
version = "0.1.0"
description = "Compare Codex and Claude Code repository instruction discovery."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

[project.scripts]
agent-rule-inspector = "rule_inspector:main"

[tool.setuptools]
py-modules = ["rule_inspector"]
